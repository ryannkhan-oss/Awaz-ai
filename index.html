return`Local context (aggregated, community-reported, not official): area ${AREAS[S.area].n}; Safety Index ${IX}/100 (${idxLabel(IX)}); highest-risk 500 m squares: ${top||'none reported'}; conditions: ${S.night?'night':'day'}.`+(S.route?` Last route: safest ${S.route.safe.dist} m risk ${S.route.safe.l}; shortest ${S.route.short.dist} m risk ${S.route.short.l}.`:'')}
async function ask(q){const key=(ls('awaz_gk')||'').trim();if(!key)throw new Error('add your Groq API key first');
const msgs=[{role:'system',content:"You are AWAZ AI Safety Assistant for Chitral, Pakistan. Give brief, practical, calm guidance on safe walking, harassment, mountain and weather hazards, and what to report. Use the local context below and never claim certainty. For emergencies tell the user to call Rescue 1122 or Police 15 and use the SOS button. Reply in the user's language (English or Urdu), max 120 words.\n"+ctxTxt()},...AIH.slice(-6),{role:'user',content:q}];let last;
for(const model of['openai/gpt-oss-120b','openai/gpt-oss-20b']){try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model,messages:msgs,temperature:.3,max_tokens:1500,reasoning_effort:'low'})});
if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('HTTP '+r.status+(m?': '+m.slice(0,120):''))}
const a=((await r.json()).choices[0].message.content||'').trim();if(!a)throw new Error('empty reply');AIH.push({role:'user',content:q},{role:'assistant',content:a});lastModel=model;return a}catch(e){last=e}}throw last}
const chatHtml=()=>CHAT.map(m=>`<div class="mu" style="margin:6px 0;${m.u?'text-align:end;color:var(--ink)':''}">${m.u?'':'🤖 '}${esc(m.t)}</div>`).join('');
function aiCard(){return`<div class="card"><b>🤖 AI Safety Assistant</b><div class="mu">Needs internet and your own free Groq API key, stored only on this phone (never inside the app file). Sends aggregated area risk only, never your reports, location or contacts. Everything else works offline.</div><input id="gk" type="password" autocomplete="off" placeholder="Groq API key (gsk_...)" value="${esc(ls('awaz_gk')||'')}" onchange="sls('awaz_gk',this.value.trim())"><div id="chat" style="max-height:260px;overflow:auto">${chatHtml()}</div><input id="cq" type="text" placeholder="Ask about a route, hazard or safety tip… / اردو میں پوچھیں" onkeydown="if(event.key==='Enter')sendQ()"><button class="btn" onclick="sendQ()">Ask AI</button><button class="btn s" onclick="testAI()">🔌 Test AI connection</button><div class="mu" id="aist"></div></div>`}
async function sendQ(){const i=$('#cq'),q=i.value.trim();if(!q)return;sls('awaz_gk',$('#gk').value.trim());i.value='';CHAT.push({u:1,t:q},{t:'Thinking…'});$('#chat').innerHTML=chatHtml();
try{const a=await ask(q);CHAT.pop();CHAT.push({t:a})}catch(e){CHAT.pop();CHAT.push({t:'AI unavailable ('+e.message+'). Check internet and key. The rest of AWAZ AI still works offline.'})}$('#chat').innerHTML=chatHtml();$('#chat').scrollTop=1e5}
async function testAI(){const el=$('#aist');sls('awaz_gk',$('#gk').value.trim());if(el)el.textContent='Testing…';try{await ask('Reply with the single word OK.');if(el)el.textContent='✅ Connected · model '+lastModel}catch(e){if(el)el.textContent='❌ '+e.message+' (needs internet and a valid Groq key)'}}
async function explainRoute(){const f=S.route.safe,s=S.route.short;modal('<h3>🤖 AI route explanation</h3><p id="rx" class="mu">Thinking…</p>');
try{$('#rx').innerHTML=esc(await ask(`Explain briefly why AWAZ AI chose this route and give one practical tip. Safest: ${f.dist} m, ${f.min} min, risk ${f.l}, via ${f.via.join(', ')||'unnamed paths'}. Shortest: ${s.dist} m, ${s.min} min, risk ${s.l}.`))}catch(e){$('#rx').textContent='AI unavailable ('+e.message+'). Add a Groq key in MORE and connect to the internet.'}}
/* ---------- info screens & demo tools ---------- */
function truth(){const row=(b,t,d)=>`<tr><td style="width:34px">${b}</td><td><b>${t}</b><div class="mu">${d}</div></td></tr>`;
modal(`<h3>What is real AI &amp; what is demo</h3><table>
${row('✅','Acoustic neural network','Real. Mel-spectrogram features → trained network, int8 weights, offline. Ships with a starter model trained on synthetic sounds; retrain on your own recordings.')}
${row('🌐','AI Safety Assistant, route explanations','Real LLM calls to Groq (openai/gpt-oss-120b, fallback gpt-oss-20b). Needs internet and your own API key.')}
${row('✅','Roads and places','Real OpenStreetMap data once downloaded for an area. Routing runs offline over it. Paths missing from OpenStreetMap are missing here.')}
${row('✅','Dijkstra, DBSCAN, spam rules','Real algorithms and rules (daily limit, duplicate removal, on-site trust, decay, several phones needed). They are not machine learning, and they reduce spam but cannot eliminate it.')}
${row('✅','Encryption and hashing','AES-GCM, SHA-256, on-device storage. Not zero-knowledge.')}
${row('🧪','Phone-to-phone relay','Implemented in the Android app with Nearby Connections; not yet field-tested on real phones. Preview mode in a browser is a simulation. No guaranteed delivery.')}
${row('🧪','Reports and Safety Index','Reports shown at first are fictional demo data. The index is a transparent formula, not an official rating and not ML.')}</table>`)}
function priv(){modal(`<h3>🛡️ Privacy by Design</h3><b>Stores</b><ul><li>A ~500 m square for each report, category and time</li><li>A random pseudonymous phone token (for spam limits)</li><li>Private diary entries, encrypted</li><li>Trusted contacts (on this phone only)</li></ul><b>Avoids</b><ul><li>Names, phone numbers or accounts in reports</li><li>Exact locations, raw audio, device identifiers</li></ul><p class="mu"><b>Be precise:</b> SHA-256 gives IDs, not encryption. AES-GCM encrypts emergency data and diary entries at rest. This is metadata minimization, not zero-knowledge cryptography, and not a guarantee of anonymity. The Android app goes online only for satellite tiles, OpenStreetMap data and (with your key) the AI assistant. Reports, diary entries and contacts are never uploaded. The key sits in app storage; production should use the Android Keystore. The phone token resets if the app is reinstalled, so spam limits are a deterrent, not a lock.</p>`)}
function demo(){modal(`<h3>Demo panel</h3><button class="btn s" onclick="S.off=!S.off;render()">Toggle offline badge</button><button class="btn s" onclick="addDemo()">Add corroborating reports here (3 phones)</button><button class="btn s" onclick="addHaz()">Add landslide hazard here</button><button class="btn s" onclick="testEnc()">Test encryption round-trip</button><button class="btn s" onclick="S.reports=mkDemo();S.alerts=[];S.route=null;save();render()">Reset demo data</button>`)}
function addDemo(){const c=S.loc||cellOf(M.la,M.lo);['Verbal Harassment','Stalking / Followed','Poor Lighting'].forEach((k,i)=>S.reports.push({id:'d'+Date.now()+i,cat:k,cell:c,sev:CAT[k][0],haz:0,t:Date.now()-i*6e5,ts:Date.now(),d:'demo'+i+'x',trust:.8,demo:1}));save();S.route=null;render()}
function addHaz(){const c=S.loc||cellOf(M.la,M.lo);S.reports.push({id:'h'+Date.now(),cat:'Road Blocked / Landslide',cell:c,sev:3,haz:1,t:Date.now(),ts:Date.now(),d:'demohz',trust:.8,demo:1});save();S.route=null;render()}
async function testEnc(){try{const e=await enc({hello:'awaz'}),d=await dec(e);modal(`<h3>Encryption OK</h3><p class="mu">Ciphertext: ${e.slice(0,48)}…<br>Decrypted: ${JSON.stringify(d)}</p>`)}catch(x){modal('<h3>Encryption failed</h3><p>Needs a secure (HTTPS) context.</p>')}}
/* ---------- start ---------- */
loadArea(S.area);
addEventListener('online',()=>{if(!S.osm&&AREAS[S.area].id!=='drosh')dlOSM(true);render()});addEventListener('offline',render);
addEventListener('resize',()=>{if($('#mp'))mapInit()});
render();
setTimeout(()=>{const s=$('#splash');if(s){s.style.opacity=0;setTimeout(()=>s.remove(),700)}},1500);
if(!S.osm&&AREAS[S.area].id!=='drosh'&&navigator.onLine)dlOSM(true);
if(NAT&&S.mesh)setTimeout(()=>NAT.start(),800);

</script>
